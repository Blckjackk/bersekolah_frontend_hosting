name: Deploy ke Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node (with cache)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies (faster)
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build project
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL || 'https://api.bersekolah.com/api' }}
          PUBLIC_API_BASE_URL_NO_API: ${{ secrets.PUBLIC_API_BASE_URL_NO_API || 'https://api.bersekolah.com' }}
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          # IMPORTANT:
          # Most Hostinger FTP users are already chrooted near public web root.
          # Set `FTP_SERVER_DIR` secret if your account needs a custom directory,
          # e.g. `domains/bersekolah.com/public_html/`.
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: true
          log-level: verbose
